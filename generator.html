<!DOCTYPE html>
<html>
<head>
  <title>Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2 id="roleTitle"></h2>

    <div class="card">
      <button onclick="generatePassword()">Generate Password</button>
      <button onclick="generatePassphrase()">Generate Passphrase</button>
      <p id="output"></p>
    </div>

    <div class="card">
      <h3>Bulk Generator (Excel Upload)</h3>
      <input type="file" id="fileInput" accept=".xlsx">
      <button onclick="handleFile()">Process File</button>
      <table id="preview"></table>
      <button onclick="exportData()">Export</button>
    </div>

    <div class="card">
      <h3>Tips for Staying Secure</h3>
      <ul>
        <li>Use unique passwords for every account</li>
        <li>Do not share passwords with others</li>
        <li>Enable multi-factor authentication (MFA)</li>
        <li>Avoid writing passwords down in visible places</li>
        <li>Use a password manager where possible</li>
      </ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
