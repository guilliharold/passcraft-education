<!DOCTYPE html>
<html>
<head>
  <title>PassCraft Education</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container center">
    <h1>PassCraft Education</h1>
    <div class="button-group">
      <button onclick="selectRole('staff')">Teaching Staff</button>
      <button onclick="selectRole('student')">Students</button>
    </div>
  </div>

  <script>
    function selectRole(role) {
      localStorage.setItem("role", role);
      window.location.href = "generator.html";
    }
  </script>
</body>
</html>
