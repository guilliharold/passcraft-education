<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="app">
    <div class="card">

      <div class="header">
        <h1>Password Generator</h1>
        <p>Memorable. Secure. Student-friendly.</p>
      </div>

      <div class="password-box">
        <input id="passwordOutput" readonly placeholder="Click generate..." />
        <button id="copyBtn" title="Copy">📋</button>
      </div>

      <div class="strength">
        <div class="strength-bar">
          <div id="strengthFill"></div>
        </div>
        <p id="strengthText">Strength: —</p>
      </div>

      <p id="patternHint" class="pattern-hint"></p>

      <button id="generateBtn" class="generate-btn">
        Generate Password
      </button>

      <p class="footer-note">
        Generated locally • Nothing is stored
      </p>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
