<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Password Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>Password Generator</h1>
      <p class="subtitle">Memorable & Secure Passwords</p>

      <div class="output-container">
        <input type="text" id="passwordOutput" readonly />
        <button id="copyBtn">Copy</button>
      </div>

      <div class="controls">
        <label for="patternSelect">Choose Pattern:</label>
        <select id="patternSelect">
          <option value="colour">Colour + Animal + Number + Symbol</option>
          <option value="adjective">Adjective + Animal + Year + Symbol</option>
        </select>

        <button id="generateBtn">Generate Password</button>
      </div>

      <p class="info">
        These passwords are generated locally and never stored.
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
